<svg xmlns="http://www.w3.org/2000/svg" width="168" height="40" viewBox="0 0 168 40">
  <defs>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#0d2a5c"/>
    </linearGradient>
  </defs>
  <!-- SC badge -->
  <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#badge)"/>
  <text x="20" y="27" text-anchor="middle" fill="white"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="900" letter-spacing="0.5">SC</text>
  <!-- SCOTSA wordmark -->
  <text x="50" y="19" fill="#0A1F44"
        font-family="system-ui, -apple-system, sans-serif"
