<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="light-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Badge body — translucent on dark bg -->
  <rect width="48" height="48" rx="12" fill="rgba(255,255,255,0.08)"/>

  <!-- Top highlight -->
  <rect x="1" y="1" width="46" height="22" rx="11" fill="url(#light-shine)"/>

  <!-- Border — more visible against dark -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Gold accent bar — bottom -->
  <rect x="9" y="40.5" width="30" height="3.5" rx="1.75" fill="#D4AF37"/>

  <!-- SC monogram in white -->
  <text x="24" y="30.5"
        text-anchor="middle"
        fill="white"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="17"
        font-weight="900"
        letter-spacing="2.5">SC</text>
</svg>
